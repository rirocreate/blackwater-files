<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>The Blackwater Files</title>
<style>
    :root {
        --accent: #c0392b;
        --text: #e0e0e0;
        --bg-dark: #0a0a0a;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #000;
        color: var(--text);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        touch-action: pan-y;
    }

    .screen {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: none;
        flex-direction: column;
        background-size: cover;
        background-position: center;
    }

    .active { display: flex !important; }

    /* STATUS BAR */
    .status-bar {
        position: absolute;
        top: 0; left: 0; right: 0;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        font-size: 0.95rem;
        z-index: 100;
        background: rgba(0,0,0,0.65);
    }

    /* BACKGROUNDS */
    #detectivePhone { background-image: url('https://images.unsplash.com/photo-1611342799917-9c7f1b3b5b5e?w=1200'); }
    #deskScreen { background-image: url('https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=1200'); }
    #victimPhone { background-image: url('https://images.unsplash.com/photo-1544197804-9c2f2f1b2b2e?w=1200'); }

    /* NAVIGATION ARROWS */
    .nav-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 2.5rem;
        opacity: 0.25;
        cursor: pointer;
        z-index: 150;
        transition: opacity 0.3s;
        user-select: none;
    }
    .nav-arrow:hover { opacity: 0.5; }
    .nav-left { left: 15px; }
    .nav-right { right: 15px; }

    /* APP GRID */
    .app-grid {
        margin-top: 80px;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 35px 15px;
        text-align: center;
    }

    .app-icon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .app-icon:active { transform: scale(0.85); }

    .app-icon span {
        width: 68px; height: 68px;
        background: rgba(255,255,255,0.12);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        backdrop-filter: blur(8px);
    }

    /* APP WINDOW */
    .app-window {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(15,15,15,0.98);
        z-index: 200;
        display: none;
        flex-direction: column;
    }

    .app-header {
        padding: 15px 20px;
        background: #1f1f1f;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
    }

    .close-btn {
        background: var(--accent);
        border: none;
        color: white;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
    }

    .day-label {
        position: absolute;
        top: 35%;
        width: 100%;
        text-align: center;
        font-size: 2.8rem;
        font-weight: 700;
        letter-spacing: 4px;
        text-shadow: 0 0 30px rgba(192, 57, 43, 0.8);
        opacity: 0;
        pointer-events: none;
        z-index: 300;
    }
</style>
</head>
<body>

<!-- INTRO -->
<div id="introScreen" class="screen active">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:40px;">
        <h1 style="font-size:2.8rem; margin-bottom:20px; color:#c0392b;">THE BLACKWATER FILES</h1>
        <p id="introText" style="max-width:85%; font-size:1.2rem; line-height:1.5;"></p>
        <button id="iniziateBtn" style="margin-top:60px; padding:14px 40px; font-size:1.2rem; background:#c0392b; border:none; border-radius:12px; color:white;">INIZIATE ENQUÊTE</button>
    </div>
</div>

<!-- START DAY -->
<div id="startDayScreen" class="screen">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <h2>Jour <span id="currentDayStart">1</span></h2>
        <button id="startDayBtn" style="margin-top:40px; padding:14px 40px; font-size:1.1rem; background:#c0392b; border:none; border-radius:12px; color:white;">COMMENCER LA JOURNÉE</button>
    </div>
</div>

<!-- DETECTIVE PHONE -->
<div id="detectivePhone" class="screen">
    <div class="status-bar"><span id="phoneTime">09:41</span><span>●●●●</span></div>
    <div class="app-grid" id="detectiveApps"></div>
</div>

<!-- DESK -->
<div id="deskScreen" class="screen">
    <div class="status-bar"><span>BUREAU DU DÉTECTIVE</span><span id="deskDay">Jour 1</span></div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px;">
        <div>
            <h2>Enquête Blackwater</h2>
            <p>Indices aujourd'hui : <span id="cluesToday">0</span>/10</p>
        </div>
    </div>
</div>

<!-- VICTIM PHONE -->
<div id="victimPhone" class="screen">
    <div class="status-bar"><span>TÉLÉPHONE DE LA VICTIME</span></div>
    <div class="app-grid" id="victimApps"></div>
</div>

<!-- NAVIGATION ARROWS -->
<div class="nav-arrow nav-left" id="navLeft">←</div>
<div class="nav-arrow nav-right" id="navRight">→</div>

<!-- APP WINDOW -->
<div id="appWindow" class="app-window">
    <div class="app-header">
        <h3 id="appTitle">Application</h3>
        <button class="close-btn" id="closeApp">Fermer</button>
    </div>
    <div id="appContent" style="flex:1; padding:20px; overflow-y:auto; line-height:1.5;"></div>
</div>

<!-- DAY LABEL -->
<div id="dayLabel" class="day-label"></div>

<script>
// ==================== GAME STATE ====================
let gameState = {
    currentDay: 1,
    cluesFound: 0,
    maxDays: 100
};

let currentScreenIndex = 0;
const screens = ['detectivePhone', 'deskScreen', 'victimPhone'];

// ==================== SWITCH SCREEN ====================
function switchScreen(direction) {
    currentScreenIndex = (currentScreenIndex + direction + screens.length) % screens.length;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screens[currentScreenIndex]).classList.add('active');
}

// ==================== NAV ARROWS & SWIPE ====================
document.getElementById('navLeft').onclick = () => switchScreen(-1);
document.getElementById('navRight').onclick = () => switchScreen(1);

// Swipe support
let touchStartX = 0;
document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
document.addEventListener('touchend', e => {
    const touchEndX = e.changedTouches[0].screenX;
    if (touchEndX < touchStartX - 80) switchScreen(1);   // swipe left
    if (touchEndX > touchStartX + 80) switchScreen(-1);  // swipe right
});

// ==================== INTRO ====================
const introTexts = [
    "Bienvenue dans <strong>The Blackwater Files</strong>.",
    "Une affaire de disparition suspecte.",
    "Fouillez chaque écran.",
    "Les indices sont partout.",
    "Trois vérités possibles."
];

let introStep = 0;
function startIntro() {
    const textEl = document.getElementById('introText');
    const interval = setInterval(() => {
        introStep++;
        if (introStep >= introTexts.length) {
            clearInterval(interval);
            document.getElementById('iniziateBtn').style.opacity = 1;
            return;
        }
        textEl.innerHTML = introTexts[introStep];
    }, 2800);
}

// ==================== APPS ====================
function createApps(containerId, apps) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    apps.forEach(app => {
        const div = document.createElement('div');
        div.className = 'app-icon';
        div.innerHTML = `<span>${app.icon}</span><p>${app.name}</p>`;
        div.onclick = app.action;
        container.appendChild(div);
    });
}

const detectiveAppsList = [
    {name: "Messages", icon: "💬", action: () => openMessages("detective")},
    {name: "Contacts", icon: "👥", action: () => openApp("Contacts", "Liste des contacts...")},
    {name: "Notes", icon: "📝", action: () => openApp("Notes", "Notes personnelles...")},
    {name: "Mail", icon: "✉️", action: () => openApp("Mail", "Boîte mail...")},
    {name: "Photos", icon: "📸", action: () => openApp("Photos", "Galerie...")}
];

const victimAppsList = [
    {name: "Messages", icon: "💬", action: () => openMessages("victim")},
    {name: "Photos", icon: "📸", action: () => openApp("Photos Victime", "Photos compromettantes...")},
    {name: "Notes", icon: "📝", action: () => openApp("Notes Victime", "Dernières notes...")}
];

function openApp(title, content) {
    document.getElementById('appTitle').textContent = title;
    document.getElementById('appContent').innerHTML = `<p>${content}</p><br><button onclick="findClue()" style="padding:12px 30px; background:#c0392b; color:white; border:none; border-radius:10px;">🔍 Chercher indice</button>`;
    document.getElementById('appWindow').style.display = 'flex';
}

// ==================== MESSAGES SYSTEM (avec numéros inconnus) ====================
function openMessages(type) {
    let html = `<h3>Messages</h3><div style="margin-top:15px;">`;

    if (Math.random() < 0.6) { // 60% de chance d'avoir un message anonyme
        html += `
            <div style="background:rgba(192,57,43,0.2); padding:12px; border-radius:10px; margin:10px 0;">
                <strong>Numéro Inconnu</strong><br>
                <small>Il y a 2 minutes</small><br><br>
                Vous êtes sur la bonne piste. Cherchez dans les vieux mails.<br>
                <em>- Un allié</em>
            </div>`;
        setTimeout(() => findClue(), 800); // indice automatique
    }

    html += `<p style="margin-top:20px; opacity:0.7;">Autres conversations...</p></div>`;
    
    document.getElementById('appTitle').textContent = type === "victim" ? "Messages (Victime)" : "Messages";
    document.getElementById('appContent').innerHTML = html;
    document.getElementById('appWindow').style.display = 'flex';
}

function findClue() {
    gameState.cluesFound++;
    document.getElementById('cluesToday').textContent = gameState.cluesFound;

    if (gameState.cluesFound >= 10) {
        alert(`🎉 Jour ${gameState.currentDay} terminé ! 10 indices trouvés.`);
        gameState.currentDay++;
        gameState.cluesFound = 0;
        document.getElementById('deskDay').textContent = `Jour ${gameState.currentDay}`;
        document.getElementById('currentDayStart').textContent = gameState.currentDay;
        
        if (gameState.currentDay > gameState.maxDays) {
            alert("=== FIN DU JEU ===\nVous avez atteint le 100e jour.\nUne des trois fins possibles a été débloquée.");
            gameState.currentDay = 1;
        }
        switchScreen(0);
    } else {
        alert(`Indice trouvé ! (${gameState.cluesFound}/10)`);
    }
}

// ==================== INITIALISATION ====================
document.getElementById('iniziateBtn').onclick = () => {
    document.getElementById('introScreen').classList.remove('active');
    document.getElementById('startDayScreen').classList.add('active');
};

document.getElementById('startDayBtn').onclick = () => {
    document.getElementById('startDayScreen').classList.remove('active');
    document.getElementById('detectivePhone').classList.add('active');
    document.getElementById('dayLabel').textContent = `JOUR ${gameState.currentDay}`;
    document.getElementById('dayLabel').style.opacity = 1;
    setTimeout(() => document.getElementById('dayLabel').style.opacity = 0, 1600);

    createApps('detectiveApps', detectiveAppsList);
    createApps('victimApps', victimAppsList);
};

document.getElementById('closeApp').onclick = () => {
    document.getElementById('appWindow').style.display = 'none';
};

// Mise à jour heure
setInterval(() => {
    const time = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('phoneTime').textContent = time;
}, 30000);

window.onload = startIntro;
</script>
</body>
</html>
